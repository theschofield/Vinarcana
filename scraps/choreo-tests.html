<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>choreography regression suite</title>
<!--
  THE CHOREOGRAPHY LAWS, AS EXECUTABLE TESTS. Run before shipping ANY
  transition change: open this file on the dev server (Browser pane,
  simulator Safari, or a device) and read the report. Green = the laws
  hold; any FAIL line names the broken law and the measured value.

  T1 DECK EXIT · the ABSOLUTE BOTTOM tile (deepest grid scroll)
     · the tile → actor takeover is same-frame and pixel-continuous
     · THE DOCUMENT NEVER MOVES — the grid is an independent scroller
       over the stage (Ed's construction), so the Lenses composes like
       the Approach with zero scroll reconciliation
     · the grid's own scroll holds still while its tiles fade in place
     · no tile ever travels UP (they sink 28px as they fade, in place)
     · the tapped card rides one smooth viewport arc — no flips, no jumps
  T2 LENS PICK · reading → pour
     · the document holds scroll 0 for the whole transition
     · the .va box never changes width (no horizontal squeeze)
     · the actor's box moves continuously — no frame-to-frame teleports
  T3 THE FLIP · deeper reading from the pour
     · the card is never hidden before the flip face has pixels
       (dr-swap must not appear while the flip container is transparent)
     · the flip reaches −180° open
  T5 STAGE PAN MEMBERSHIP · on the Lenses at rest
     · every touchable point resolves through a touch-action:none chain —
       no drag anywhere on a stage may pan the document (membership rule)
  T6 HANDOFF CONTINUITY · the Lenses → Pour swap
     · across the actor → pane-card cut, the pose is continuous within
       ~2px (the two-cards-trading-places grammar, suite-enforced)
  T4 RELEASE · let-it-fade from a scrolled pour
     · the pour's panes scroll in their own layer over the stage —
       THE DOCUMENT NEVER MOVES through the release, from any depth

  Machine-readable copy of the report: window.__choreoReport
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  #log { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 999999;
    background: rgba(0,0,0,0.88); color: #7CFC00; font: 700 12px/1.45 Menlo, monospace;
    padding: 8px 10px; white-space: pre-wrap; pointer-events: none; }
  #log .fail { color: #ff5252; }
  iframe { position: fixed; inset: 0; border: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="log">booting…</div>
<iframe id="f" src="/index.html"></iframe>
<script>
(async () => {
  const logEl = document.getElementById("log");
  const lines = [];
  const show = (extra) => { logEl.innerHTML = lines.join("\n") + (extra ? "\n" + extra : ""); };
  const say = (m) => { lines.push(m); show(); };
  const verdict = (name, fails) => {
    if (!fails.length) { say(name + " — PASS"); return true; }
    lines.push('<span class="fail">' + name + " — FAIL\n  " + fails.join("\n  ") + "</span>");
    show(); return false;
  };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const f = document.getElementById("f");
  const W = () => f.contentWindow;
  const D = () => f.contentWindow.document;
  const report = { pass: [], fail: [], skip: [] };
  window.__choreoReport = report;
  const book = (name, ok, fails) => (ok ? report.pass : report.fail).push({ name, fails });

  // on desktop hosts the iframe believes it's a phone so doc mode runs
  if (window.matchMedia("(hover: hover)").matches) {
    const mk = (m) => ({ matches: m, media: "", addEventListener(){}, removeEventListener(){}, addListener(){}, removeListener(){} });
    const patch = () => { try {
      const w = W(); if (!w || w.__patched) return;
      const om = w.matchMedia ? w.matchMedia.bind(w) : null;
      w.matchMedia = (q) => {
        if (q.indexOf("hover: none") >= 0 && q.indexOf("coarse") >= 0) return mk(true);
        if (q.indexOf("hover: hover") >= 0) return mk(false);
        if (q.indexOf("display-mode") >= 0) return mk(false);
        if (q.indexOf("min-width") >= 0) return mk(false);
        return om ? om(q) : mk(false);
      };
      w.__patched = true;
    } catch (e) {} };
    patch(); setTimeout(patch, 0); setTimeout(patch, 30);
  }

  // rAF sampler: collects fn(t) rows for `dur` ms
  const sample = (dur, fn) => new Promise(done => {
    const rows = [], t0 = performance.now();
    const tick = () => {
      const t = performance.now() - t0;
      try { rows.push(Object.assign({ t: Math.round(t) }, fn())) } catch (e) {}
      if (t < dur) requestAnimationFrame(tick); else done(rows);
    };
    requestAnimationFrame(tick);
  });
  const tap = (el) => {
    const cw = W(), r = el.getBoundingClientRect();
    const o = { bubbles: true, cancelable: true, pointerId: 9, pointerType: "touch",
      clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, isPrimary: true };
    el.dispatchEvent(new cw.PointerEvent("pointerdown", o));
    el.dispatchEvent(new cw.PointerEvent("pointerup", o));
    el.dispatchEvent(new cw.MouseEvent("click", o));
  };
  const waitPhase = async (p, tries) => {
    let t = 0; while (W().__vaDrive.phase() !== p && t++ < (tries || 120)) await sleep(100);
    return W().__vaDrive.phase() === p;
  };

  let t = 0; while (!(W() && W().__vaDrive) && t++ < 300) await sleep(100);
  if (!(W() && W().__vaDrive)) return say("FAIL: app never booted");

  // ---------- T1 · DECK EXIT (deep-scroll ride) ----------
  say("T1 deck exit — running…");
  W().__vaDrive.deck();
  await waitPhase("deck");
  await sleep(1600);
  // the ABSOLUTE BOTTOM tile — deepest GRID scroll (the deck is an
  // independent scroller over the stage; the DOCUMENT never moves)
  const tiles = [...D().querySelectorAll(".dk-tile")];
  const moon = tiles[tiles.length - 1];
  if (!moon) return say("FAIL: no tiles");
  const gridEl = D().querySelector(".dk-scroll");
  gridEl.scrollTop = gridEl.scrollHeight;
  await sleep(700);
  const g0 = Math.round(gridEl.scrollTop);
  const s0 = Math.round(W().scrollY);
  // a witness tile a couple of rows above the tapped one
  const witness = tiles[Math.max(0, tiles.indexOf(moon) - 6)];
  const w0 = witness.getBoundingClientRect().top;
  const tile0 = moon.getBoundingClientRect();
  tap(moon);
  // the takeover is same-frame: one rAF later the actor must sit on the
  // tile's exact rect (the canvas's handoff-at-rest, suite-enforced)
  const take = await new Promise(res => requestAnimationFrame(() => {
    const a = D().querySelector(".va-card-actor");
    if (!a) return res(null);
    const r = a.getBoundingClientRect();
    res({ dx: Math.abs(r.left - tile0.left), dy: Math.abs(r.top - tile0.top), dw: Math.abs(r.width - tile0.width) });
  }));
  const t1 = await sample(3400, () => {
    const a = D().querySelector(".va-card-actor");
    // the witness detaches when the deck unmounts on the bleed beat —
    // detached rects read as 0 and would fake a "travelled up" failure
    const alive = witness.isConnected;
    return {
      s: W().scrollY,
      g: gridEl.isConnected ? gridEl.scrollTop : NaN,
      aT: a ? a.getBoundingClientRect().top : NaN,
      aO: a ? +getComputedStyle(a).opacity : NaN,
      wT: alive ? witness.getBoundingClientRect().top : NaN,
      wO: alive ? +getComputedStyle(witness).opacity : 0,
    };
  });
  {
    const fails = [];
    const vh = W().innerHeight;
    // law: the takeover is pixel-continuous
    if (!take) fails.push("no actor one frame after the tap");
    else if (Math.max(take.dx, take.dy, take.dw) > 1.5)
      fails.push("takeover jumped " + Math.max(take.dx, take.dy, take.dw).toFixed(1) + "px off the tile");
    // law: THE DOCUMENT NEVER MOVES during a deck ride (the grid is an
    // independent scroller; the Lenses composes like the Approach)
    const sAll = Math.max(...t1.map(r => Math.abs(r.s - s0)));
    if (sAll > 2) fails.push("the DOCUMENT moved " + Math.round(sAll) + "px during the ride (law: the deck never scrolls the document)");
    if (g0 < 800) fails.push("grid only scrolled " + g0 + "px — deep-scroll premise broken");
    // law: the grid's own scroll holds still while its tiles fade out
    const gRows = t1.filter(r => !isNaN(r.g));
    if (gRows.length) {
      const gMax = Math.max(...gRows.map(r => Math.abs(r.g - g0)));
      if (gMax > 1) fails.push("the grid's scroll moved " + Math.round(gMax) + "px during the exit");
    }
    // law: tiles sink, never rise
    const wRows = t1.filter(r => r.t < 600 && !isNaN(r.wT));
    const wUp = Math.min(...wRows.map(r => r.wT - w0));
    if (wUp < -4) fails.push("a tile travelled UP " + Math.round(-wUp) + "px (law: the grid sinks as it fades)");
    // law: the tile is gone before the teleport beat
    const late = t1.filter(r => r.t >= 700 && r.t < 900);
    if (late.length && Math.min(...late.map(r => r.wO)) > 0.05)
      fails.push("tiles still visible at 700ms (opacity " + Math.max(...late.map(r => r.wO)).toFixed(2) + ")");
    // law: one smooth viewport arc for the card. The designed ride has up
    // to three vertical direction changes (lift up · settle shrink drops
    // the top edge · rest rises to the slot) — more means oscillation.
    // Jumps are judged by VELOCITY (px/ms): a dropped frame at 120Hz
    // doubles the px of a legitimate beat step, a teleport is 10× it.
    let flips = 0, prevDir = 0, aV = 0, minY = 1e9, maxY = -1e9;
    const ar = t1.filter(r => !isNaN(r.aT));
    for (let i = 1; i < ar.length; i++) {
      const dY = ar[i].aT - ar[i - 1].aT;
      const dt = Math.max(1, ar[i].t - ar[i - 1].t);
      minY = Math.min(minY, ar[i].aT); maxY = Math.max(maxY, ar[i].aT);
      if (Math.abs(dY) >= 30) aV = Math.max(aV, Math.abs(dY) / dt);
      if (Math.abs(dY) < 2) continue;
      const dir = dY > 0 ? 1 : -1;
      if (prevDir && dir !== prevDir) flips++;
      prevDir = dir;
    }
    if (flips > 3) fails.push("card changed direction " + flips + " times");
    if (aV > 3.2) fails.push("card moved " + aV.toFixed(1) + "px/ms (teleport-scale)");
    if (minY < -60 || maxY > vh + 10) fails.push("card left the viewport [" + Math.round(minY) + ", " + Math.round(maxY) + "]");
    if (Math.min(...ar.map(r => r.aO)) < 0.99) fails.push("card opacity dipped to " + Math.min(...ar.map(r => r.aO)).toFixed(2));
    book("T1 deck exit", verdict("T1 deck exit (grid at " + g0 + ", document still)", fails), fails);
  }

  // ---------- T5 · STAGE PAN MEMBERSHIP (the Lenses must not scroll) ----------
  if (!(await waitPhase("reading"))) return say("FAIL: never reached reading");
  await sleep(900);
  say("T5 stage pan membership — running…");
  {
    // every touchable point on the stage must resolve to an element whose
    // self-or-ancestor chain carries touch-action: none — otherwise a drag
    // there pans the document and the decoy's overshoot slack scrolls out
    // from under the Lenses (the .dr-hit incident)
    const fails = [];
    const va = D().querySelector(".va");
    const blocked = (el) => { let n = el;
      while (n && n !== D().documentElement) { if (W().getComputedStyle(n).touchAction === "none") return true; n = n.parentElement; }
      return false; };
    const offenders = new Set();
    for (let gx = 0.06; gx < 1; gx += 0.12) for (let gy = 0.05; gy < 1; gy += 0.08) {
      const el = D().elementFromPoint(gx * W().innerWidth, gy * W().innerHeight);
      if (!el || !va.contains(el)) continue;
      if (!blocked(el)) offenders.add((el.className && String(el.className).split(" ")[0]) || el.tagName.toLowerCase());
    }
    if (offenders.size) fails.push("pan reaches the document through: " + [...offenders].slice(0, 6).join(", "));
    book("T5 stage pan membership", verdict("T5 stage pan membership", fails), fails);
  }

  // ---------- T2 · LENS PICK (reading → pour) ----------
  say("T2 lens pick — running…");
  const vaEl = D().querySelector(".va");
  const vaW0 = vaEl.getBoundingClientRect().width;
  W().__vaDrive.pick(0);
  const t2 = await sample(2400, () => {
    const a = D().querySelector(".va-card-actor");
    const r = a ? a.getBoundingClientRect() : null;
    const cs = a ? W().getComputedStyle(a) : null;
    const live = D().querySelector(".rv-hero .card.live");
    const lr = live ? live.getBoundingClientRect() : null;
    return { s: W().scrollY, vaW: vaEl.getBoundingClientRect().width,
      aL: r ? r.left : NaN, aT: r ? r.top : NaN, aW: r ? r.width : NaN,
      aVis: !!(cs && cs.visibility !== "hidden" && +cs.opacity > 0.5),
      cL: lr ? lr.left : NaN, cT: lr ? lr.top : NaN, cW: lr ? lr.width : NaN };
  });
  {
    const fails = [];
    const sMax = Math.max(...t2.map(r => Math.abs(r.s)));
    if (sMax > 1) fails.push("document scrolled " + Math.round(sMax) + "px mid-transition (law: stages sit at scroll 0)");
    const wDelta = Math.max(...t2.map(r => Math.abs(r.vaW - vaW0)));
    if (wDelta > 1) fails.push(".va width changed " + Math.round(wDelta) + "px (the horizontal squeeze)");
    let maxJump = 0;
    const ar = t2.filter(r => !isNaN(r.aL));
    for (let i = 1; i < ar.length; i++)
      maxJump = Math.max(maxJump, Math.abs(ar[i].aL - ar[i - 1].aL), Math.abs(ar[i].aT - ar[i - 1].aT), Math.abs(ar[i].aW - ar[i - 1].aW));
    if (maxJump > 14) fails.push("actor teleported " + Math.round(maxJump) + "px in one frame (law: continuous motion)");
    book("T2 lens pick", verdict("T2 lens pick", fails), fails);
  }

  // ---------- T6 · HANDOFF CONTINUITY (actor → pane card, the living swap) ----------
  say("T6 handoff continuity — running…");
  {
    const fails = [];
    // the cut: the last frame the actor is visible vs the first frame the
    // pane's live card carries the image — same pose, within tolerance
    let cut = -1;
    for (let i = 1; i < t2.length; i++) if (t2[i - 1].aVis && !t2[i].aVis) { cut = i; break; }
    if (cut < 0) fails.push("no actor→card cut observed in the pick window");
    else {
      const a = t2[cut - 1], c = t2.slice(cut).find(r => !isNaN(r.cL));
      if (!c) fails.push("pane card never appeared after the cut");
      else {
        const d = Math.max(Math.abs(a.aL - c.cL), Math.abs(a.aT - c.cT), Math.abs(a.aW - c.cW));
        if (d > 2.5) fails.push("handoff discontinuity: " + d.toFixed(1) + "px between actor and pane card");
      }
    }
    book("T6 handoff continuity", verdict("T6 handoff continuity", fails), fails);
  }

  // ---------- T3 · THE FLIP (decode-gated swap) ----------
  if (!(await waitPhase("reveal"))) return say("FAIL: never reached reveal");
  await sleep(900);
  say("T3 the flip — running…");
  W().__vaDrive.deeper("pour");
  const t3 = await sample(1800, () => {
    // "the card" pre-swap is whichever element carries it on this screen:
    // the actor (reading) or the pour pane's hero card (post-handoff)
    const vis = (el) => !!el && getComputedStyle(el).visibility !== "hidden" && +getComputedStyle(el).opacity > 0.9;
    const fl = D().querySelector(".dr-flip");
    const fp = D().querySelector(".dr-flipper");
    let ang = NaN;
    if (fp) {
      const m = getComputedStyle(fp).transform.match(/matrix3d\(([^)]+)\)/);
      if (m) { const v = m[1].split(",").map(Number); ang = Math.atan2(-v[2], v[0]) * 180 / Math.PI; }
    }
    return {
      swap: D().querySelector(".va").className.indexOf("dr-swap") >= 0,
      aVis: vis(D().querySelector(".va-card-actor")) || vis(D().querySelector(".rv-hero .card")),
      fO: fl ? +getComputedStyle(fl).opacity : NaN,
      ang,
    };
  });
  {
    const fails = [];
    // law: never a hole — dr-swap (card hidden) requires flip pixels on screen
    const holes = t3.filter(r => r.swap && !(r.fO > 0.5));
    if (holes.length) fails.push("card hidden while the flip face was transparent (" + holes.length + " frames — the hole)");
    // before the swap the real card must be the thing on screen
    const pre = t3.filter(r => !r.swap && !isNaN(r.fO));
    if (pre.some(r => !r.aVis && r.fO < 0.5)) fails.push("blank frame before the swap");
    const last = t3[t3.length - 1];
    if (!(Math.abs((last.ang || 0) + 180) < 4)) fails.push("flip ended at " + Math.round(last.ang) + "° (want −180°)");
    book("T3 the flip", verdict("T3 the flip", fails), fails);
  }
  const closeBtn = D().querySelector(".gp-close-btn");
  if (closeBtn) { tap(closeBtn); await sleep(1600); }

  // ---------- T4 · RELEASE from a scrolled pour ----------
  // Ed's construction: the pour's panes scroll in their own layer over
  // the stage — the DOCUMENT must hold still through the release, from
  // any pane scroll depth.
  say("T4 release — running…");
  const vsc = D().querySelector(".rv-vscroll");
  if (vsc) vsc.scrollTop = 600;
  await sleep(400);
  const v4 = vsc ? Math.round(vsc.scrollTop) : 0;
  {
    W().__vaDrive.release();
    const t4 = await sample(1100, () => ({ s: W().scrollY }));
    const fails = [];
    const sMax = Math.max(...t4.map(r => Math.abs(r.s)));
    if (sMax > 2) fails.push("the DOCUMENT moved " + Math.round(sMax) + "px during the release (law: pane scroll never touches the document)");
    if (v4 < 50) fails.push("pane only scrolled " + v4 + "px — scrolled-release premise weak");
    book("T4 release", verdict("T4 release (pane at " + v4 + ", document still)", fails), fails);
    await waitPhase("approach", 40);
  }

  say("— suite done · " + report.pass.length + " pass · " + report.fail.length + " fail" +
    (report.skip.length ? " · " + report.skip.length + " skip" : ""));
})();
</script>
</body>
</html>
