<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>deck ride probe</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; }
  #log { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 999999;
    background: rgba(0,0,0,0.85); color: #7CFC00; font: 700 15px/1.5 Menlo, monospace;
    padding: 10px 12px; white-space: pre-wrap; pointer-events: none; }
  #log.fail { color: #ff5252; }
  iframe { position: fixed; inset: 0; border: 0; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="log">booting…</div>
<iframe id="f" src="/index.html"></iframe>
<script>
(async () => {
  const logEl = document.getElementById("log");
  const log = (m, fail) => { logEl.textContent = m; logEl.className = fail ? "fail" : ""; };
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const f = document.getElementById("f");
  const W = () => f.contentWindow;

  // on desktop hosts, make the iframe believe it's a phone so doc mode runs;
  // on a real touch device (or the simulator) the patch is unnecessary
  if (window.matchMedia("(hover: hover)").matches) {
    const mk = (m) => ({ matches: m, media: "", addEventListener(){}, removeEventListener(){}, addListener(){}, removeListener(){} });
    const patch = () => { try {
      const w = W(); if (!w || w.__patched) return;
      const om = w.matchMedia ? w.matchMedia.bind(w) : null;
      w.matchMedia = (q) => {
        if (q.indexOf("hover: none") >= 0 && q.indexOf("coarse") >= 0) return mk(true);
        if (q.indexOf("hover: hover") >= 0) return mk(false);
        if (q.indexOf("display-mode") >= 0) return mk(false);
        if (q.indexOf("min-width") >= 0) return mk(false);
        return om ? om(q) : mk(false);
      };
      w.__patched = true;
    } catch (e) {} };
    patch(); setTimeout(patch, 0); setTimeout(patch, 30);
  }

  let t = 0; while (!(W() && W().__vaDrive) && t++ < 300) await sleep(100);
  if (!(W() && W().__vaDrive)) return log("FAIL: app never booted", true);
  log("booted · going to deck…");
  W().__vaDrive.deck();
  t = 0; while (W().__vaDrive.phase() !== "deck" && t++ < 100) await sleep(100);
  await sleep(1600);

  const d = W().document;
  const moon = [...d.querySelectorAll(".dk-tile")].find(x => /\/moon\.webp$/.test((x.querySelector("img") || {}).src || ""));
  if (!moon) return log("FAIL: moon tile not found", true);
  const r0 = moon.getBoundingClientRect();
  W().scrollTo(0, W().scrollY + r0.top - 340);
  await sleep(700);
  const sy0 = Math.round(W().scrollY);
  log("scrolled to " + sy0 + " · tapping The Moon…");

  const cw = W();
  const r = moon.getBoundingClientRect();
  const o = { bubbles: true, cancelable: true, pointerId: 9, pointerType: "touch",
    clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, isPrimary: true };
  moon.dispatchEvent(new cw.PointerEvent("pointerdown", o));
  moon.dispatchEvent(new cw.PointerEvent("pointerup", o));
  moon.dispatchEvent(new cw.MouseEvent("click", o));

  // per-frame trace of the actor's on-screen top for 1.4s
  const ys = [], sys = [];
  const t0 = performance.now();
  await new Promise(done => {
    const tick = () => {
      const a = d.querySelector(".va-card-actor");
      if (a) { ys.push(a.getBoundingClientRect().top); sys.push(W().scrollY); }
      if (performance.now() - t0 < 1400) requestAnimationFrame(tick); else done();
    };
    requestAnimationFrame(tick);
  });

  if (ys.length < 20) return log("FAIL: only " + ys.length + " frames sampled", true);
  let flips = 0, prevDir = 0, minY = 1e9, maxY = -1e9, maxJump = 0;
  for (let i = 1; i < ys.length; i++) {
    const dY = ys[i] - ys[i - 1];
    minY = Math.min(minY, ys[i]); maxY = Math.max(maxY, ys[i]);
    maxJump = Math.max(maxJump, Math.abs(dY));
    if (Math.abs(dY) < 2) continue;
    const dir = dY > 0 ? 1 : -1;
    if (prevDir && dir !== prevDir) flips++;
    prevDir = dir;
  }
  const vh = W().innerHeight;
  const offscreen = minY < -60 || maxY > vh + 10;
  const ok = flips <= 3 && !offscreen && maxJump < 200;
  log((ok ? "PASS" : "FAIL") +
    "  flips:" + flips + "  maxJump:" + Math.round(maxJump) + "px" +
    "\nscreenY " + Math.round(ys[0]) + " → " + Math.round(ys[ys.length - 1]) +
    "  band [" + Math.round(minY) + ", " + Math.round(maxY) + "]  vh:" + vh +
    "\nscroll " + sy0 + " → " + Math.round(sys[sys.length - 1]) +
    "  frames:" + ys.length + "  phase:" + W().__vaDrive.phase(), !ok);

  // then exercise THE FLIP with diagnostics: sample the container's
  // computed styles while it should be rotating. The deckfly timeline
  // reaches "reading" ~6.3s after the tap — WAIT for it, don't guess.
  t = 0; while (W().__vaDrive.phase() !== "reading" && t++ < 120) await sleep(100);
  await sleep(800);
  if (W().__vaDrive.phase() === "reading") {
    W().__vaDrive.deeper();
    const lines = [];
    for (let k = 0; k < 5; k++) {
      await sleep(320);
      const fl = d.querySelector(".dr-flip");
      const fp = d.querySelector(".dr-flipper");
      if (!fl || !fp) { lines.push(k + ": no container"); continue; }
      const cs = getComputedStyle(fp);
      const m = cs.transform.match(/matrix3d\(([^)]+)\)/);
      let ang = "flat";
      if (m) { const v = m[1].split(",").map(Number); ang = (Math.atan2(-v[2], v[0]) * 180 / Math.PI).toFixed(0) + "°"; }
      else if (cs.transform !== "none") ang = "2d:" + cs.transform.slice(0, 24);
      lines.push(k + ": ang " + ang + " w" + Math.round(fl.getBoundingClientRect().width) +
        " o" + getComputedStyle(fl).opacity +
        " tr[" + (fp.style.transition || "unset").slice(0, 38) + "]" +
        " swap:" + (d.documentElement.querySelector(".va").className.includes("dr-swap") ? "y" : "n"));
    }
    log("FLIP DIAG\n" + lines.join("\n"));
    await sleep(1200);
    const btn = d.querySelector(".gp-close-btn");
    if (btn) btn.click();
  }
})();
</script>
</body>
</html>
